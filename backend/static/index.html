<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LogX - The Log Sentinel</title>
<style>
  /* ====== GLOBAL ====== */
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 0;
  }

  /* ====== HEADER ====== */
  header {
    background: #161b22;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  .logo {
    font-size: 26px;
    font-weight: 700;
    color: #58a6ff;
    letter-spacing: 0.5px;
  }

  .auth-buttons {
    display: flex;
    gap: 15px;
  }

  .auth-buttons a {
    text-decoration: none;
    color: white;
    background: #238636;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    transition: background 0.2s ease-in-out;
  }

  .auth-buttons a:hover {
    background: #2ea043;
  }

  /* ====== MAIN ====== */
  main {
    width: 80%;
    margin: 40px auto;
    background: #161b22;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2 {
    color: #58a6ff;
    margin-bottom: 15px;
  }

  label {
    font-weight: bold;
    margin-top: 12px;
    display: block;
  }

  input[type="file"],
  textarea {
    width: 100%;
    margin-top: 8px;
    background: #0d1117;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
  }

  textarea {
    height: 160px;
    resize: vertical;
  }

  button {
    background: #238636;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    font-size: 15px;
    margin-top: 20px;
    transition: background 0.2s ease-in-out, transform 0.1s;
  }

  button:hover {
    background: #2ea043;
    transform: scale(1.03);
  }

  .response {
    margin-top: 15px;
    background: #0d1117;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #30363d;
    display: none;
  }

  /* ====== FOOTER ====== */
  footer {
    text-align: center;
    margin-top: 40px;
    color: #8b949e;
    font-size: 14px;
  }

  footer a {
    color: #58a6ff;
    text-decoration: none;
    margin: 0 8px;
  }

  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<header>
  <div class="logo">LogX <span style="color:#8b949e; font-weight:400;">— The Log Sentinel</span></div>
  <div class="auth-buttons">
    <a href="/login">Login</a>
    <a href="/register">Register</a>
  </div>
</header>

<main>
  <h2>Upload or Paste Logs for Analysis</h2>
  <form id="uploadForm" method="post" enctype="multipart/form-data">
    <label for="logFile">Upload Log File:</label>
    <input type="file" id="logFile" name="file" />

    <label for="logText">Or Paste Logs Here:</label>
    <textarea id="logText" name="pasted_logs" placeholder="Paste your log data here..."></textarea>

    <button type="submit" id="analyzeBtn">Analyze Logs</button>
  </form>

  <div class="response" id="response"></div>
</main>

<footer>
  &copy; 2025 LogX Project — Built for Secure Log Intelligence
</footer>

<script>
document.getElementById("uploadForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const fileInput = document.getElementById("logFile");
  const pastedLogs = document.getElementById("logText").value.trim();
  const responseDiv = document.getElementById("response");

  const formData = new FormData();
  if (fileInput.files.length > 0) {
    formData.append("file", fileInput.files[0]);
  } else if (pastedLogs.length > 0) {
    formData.append("pasted_logs", pastedLogs);
  } else {
    responseDiv.style.display = "block";
    responseDiv.textContent = "⚠️ Please upload a file or paste log data before analyzing.";
    return;
  }

  try {
    const response = await fetch("/upload", {
      method: "POST",
      body: formData
    });
    if (!response.ok) {
      const error = await response.json();
      responseDiv.style.display = "block";
      responseDiv.textContent = error.error || "Failed to analyze logs.";
      return;
    }
    const resultUrl = response.url;
    window.location.href = resultUrl;
  } catch (err) {
    responseDiv.style.display = "block";
    responseDiv.textContent = "❌ Error: " + err.message;
  }
});
</script>

</body>
</html>
