<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LogX The Log Sentinel</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 0;
  }
  header {
    background: #161b22;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #58a6ff;
  }
  main {
    width: 80%;
    margin: 30px auto;
    background: #161b22;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #0b0f13;
  }
  h2 {
    color: #58a6ff;
  }
  textarea {
    width: 100%;
    height: 150px;
    margin-top: 10px;
    background: #0d1117;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px;
    resize: vertical;
  }
  input[type="file"], button, select {
    margin-top: 15px;
  }
  button {
    background: #238636;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-weight: bold;
  }
  button:hover {
    background: #2ea043;
  }
  label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
  }
  footer {
    text-align: center;
    margin-top: 20px;
  }
  footer a {
    color: #58a6ff;
    text-decoration: none;
    margin: 0 10px;
  }
  footer a:hover {
    text-decoration: underline;
  }
  .response {
    margin-top: 15px;
    background: #0d1117;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #30363d;
    display: none;
  }
</style>
</head>
<body>
<header>LogX The Log Sentinel</header>
<main>
  <h2>Upload or Paste Logs for Analysis</h2>
  <form id="uploadForm" method="post" enctype="multipart/form-data">
    <label for="logType">Choose Log Type:</label>
    <select id="logType" name="log_type">
      <option value="custom">Custom</option>
      <option value="server">Server</option>
      <option value="system">System</option>
    </select>

    <label for="logFile">Upload Log File:</label>
    <input type="file" id="logFile" name="file" />

    <label for="logText">Or Paste Logs Here:</label>
    <textarea id="logText" name="pasted_logs" placeholder="Paste your log data here..."></textarea>

    <button type="submit" id="analyzeBtn">Analyze Logs</button>
  </form>
  <div class="response" id="response"></div>
</main>
<footer>
  &copy; 2025 LogX Project
</footer>

<script>
document.getElementById("uploadForm").addEventListener("submit", async function(e){
  e.preventDefault();
  
  const fileInput = document.getElementById("logFile");
  const pastedLogs = document.getElementById("logText").value.trim();
  const logType = document.getElementById("logType").value;
  const responseDiv = document.getElementById("response");

  const formData = new FormData();
  if(fileInput.files.length > 0){
    formData.append("file", fileInput.files[0]);
  } else if(pastedLogs.length > 0) {
    formData.append("pasted_logs", pastedLogs);
  } else {
    responseDiv.style.display = "block";
    responseDiv.textContent = "Please upload a file or paste log data before analyzing.";
    return;
  }
  formData.append("log_type", logType);

  try {
    const response = await fetch("/upload", {
      method: "POST",
      body: formData
    });
    if(!response.ok){
      const error = await response.json();
      responseDiv.style.display = "block";
      responseDiv.textContent = error.error || "Failed to analyze logs.";
      return;
    }
    const resultUrl = response.url; // This is redirected URL from Flask

    // Redirect to the result page
    window.location.href = resultUrl;

  } catch (err) {
    responseDiv.style.display = "block";
    responseDiv.textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
