<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LogX Analysis Results</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 0;
  }
  header {
    background: #161b22;
    padding: 20px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #58a6ff;
  }
  main {
    width: 80%;
    margin: 30px auto;
    background: #161b22;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #0b0f13;
  }
  h2 {
    color: #58a6ff;
  }
  pre {
    background: #0d1117;
    padding: 15px;
    border-radius: 6px;
    overflow-x: auto;
    border: 1px solid #30363d;
  }
  button {
    background: #238636;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    margin-top: 20px;
  }
  button:hover {
    background: #2ea043;
  }
</style>
</head>
<body>
<header>LogX Analysis Results</header>
<main>
  <h2>Log Summary</h2>
  <div id="resultsDiv">
    <pre>{{ result | tojson(indent=2) }}</pre>
  </div>
  <button onclick="goHome()">Analyze Another Log</button>
</main>
<script>
function goHome(){
  window.location.href = "/";
}
</script>
</body>
</html>
