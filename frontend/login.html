<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login – LogX</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
<style>
  body {
    background-color: #0d1117;
    color: #e6edf3;
    font-family: 'Inter', sans-serif;
  }
  .card {
    background-color: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
    transition: all 0.3s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 18px rgba(56,139,253,0.4);
  }
  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #30363d;
    border-radius: 6px;
    background-color: #0d1117;
    color: #e6edf3;
    margin-bottom: 12px;
  }
  input:focus {
    outline: none;
    border-color: #58a6ff;
    box-shadow: 0 0 0 2px rgba(88,166,255,0.3);
  }
  .btn {
    background-color: #238636;
    color: white;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    width: 100%;
    transition: 0.2s;
  }
  .btn:hover { background-color: #2ea043; }
  a {
    color: #58a6ff;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="card w-full max-w-sm text-center">
    <h2 class="text-2xl font-bold text-blue-400 mb-4">LogX Login</h2>
    <form id="loginForm">
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn mt-2">Login</button>
    </form>
    <p class="text-sm text-gray-400 mt-4">
      Don't have an account?
      <a href="/register">Register here</a>
    </p>
    <p id="msg" class="mt-3 text-sm"></p>
  </div>

  <script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    const j = await res.json();
    document.getElementById("msg").textContent = j.message;
    if (res.ok) setTimeout(() => location.href = "/", 1000);
  });
  </script>
</body>
</html>
