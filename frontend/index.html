<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LogX – The Log Sentinel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 0;
    }
    header {
      background: #161b22;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #58a6ff;
    }
    main {
      width: 80%;
      margin: 30px auto;
      background: #161b22;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #0b0f13;
    }
    h2 { color: #58a6ff; }
    textarea {
      width: 100%;
      height: 150px;
      margin-top: 10px;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      resize: vertical;
    }
    input[type="file"], button {
      margin-top: 15px;
    }
    button {
      background: #238636;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }
    button:hover { background: #2ea043; }
    footer {
      text-align: center;
      margin-top: 20px;
    }
    footer a {
      color: #58a6ff;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover { text-decoration: underline; }
    #response {
      margin-top: 15px;
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      display: none;
    }
  </style>
</head>
<body>
  <header>LogX – The Log Sentinel</header>
  <main>
    <h2>Analyze Your Logs Instantly</h2>
    <p>Upload system or server logs to detect anomalies, errors, and patterns. Paste logs or upload files below.</p>

    <label>Select Log Type:</label><br>
    <button onclick="setType('system')">System Logs</button>
    <button onclick="setType('server')">Server Logs</button>
    <button onclick="setType('custom')">Custom Logs</button>

    <form id="uploadForm" enctype="multipart/form-data">
      <input type="file" id="logFile" name="logFile" accept=".log,.txt,.csv"><br>
      <textarea id="logText" placeholder="Or paste your log content here..."></textarea><br>
      <button type="submit">Analyze Logs</button>
    </form>

    <div id="response"></div>
  </main>
  <footer>
    <a href="login.html">Login</a> | <a href="register.html">Register</a>
  </footer>

  <script>
    let selectedType = "custom";
    function setType(type) {
      selectedType = type;
      alert("Selected log type: " + type);
    }

    const form = document.getElementById("uploadForm");
    const responseDiv = document.getElementById("response");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("logFile");
      const textInput = document.getElementById("logText").value.trim();
      const formData = new FormData();
      formData.append("log_type", selectedType);

      if (fileInput.files.length > 0) {
        formData.append("file", fileInput.files[0]);
      } else if (textInput) {
        formData.append("text", textInput);
      } else {
        alert("Please upload a file or paste logs.");
        return;
      }

      try {
        const res = await fetch("http://127.0.0.1:5000/upload", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        responseDiv.style.display = "block";
        responseDiv.innerHTML = `<strong>Response:</strong> ${data.message}`;
      } catch (err) {
        responseDiv.style.display = "block";
        responseDiv.innerHTML = `<strong>Error:</strong> Could not connect to backend.`;
      }
    });
  </script>
</body>
</html>
